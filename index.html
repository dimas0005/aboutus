<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Material & Air</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BLOCK BESAR */
        .card {
            width: 100%;
            max-width: 420px;
            background: #111111;
            border-radius: 22px;
            padding: 30px 25px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 20px 45px rgba(0,0,0,0.3);
        }

        .profile img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 3px solid #ff7a00;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .profile h1 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .profile p {
            font-size: 13px;
            color: #cfcfcf;
            margin-bottom: 25px;
        }

        .links a {
            display: block;
            text-decoration: none;
            color: #ffffff;
            background: #ff7a00;
            padding: 14px;
            margin-bottom: 14px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.25s;
        }

        .links a:hover {
            background: #e66e00;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 22px;
            padding: 14px;
            background: #1e1e1e;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #eaeaea;
        }

        footer {
            margin-top: 16px;
            font-size: 12px;
            color: #9a9a9a;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile">
            <!-- GANTI FOTO -->
            <img src="https://via.placeholder.com/150" alt="Profile">

            <h1>Uji Material & Air</h1>
            <p>Beton • Besi • Tanah • Deteksi & Bor Air</p>
        </div>

        <div class="links">
            <a href="https://instagram.com" target="_blank">📷 Instagram</a>
            <a href="https://youtube.com" target="_blank">▶️ YouTube</a>
            <a href="https://maps.google.com" target="_blank">📍 Lokasi / Google Maps</a>
            <a href="https://example.com" target="_blank">📄 About Us</a>
        </div>

        <div class="info">
            🔬 Pengujian material konstruksi & tanah<br>
            💧 Deteksi serta pengeboran air tanah<br>
            📊 Berbasis data & standar teknis
        </div>

        <footer>
            © 2026 | Material & Soil Testing
        </footer>
    </div>

</body>
</html>
